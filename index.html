<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>

        <!-- Menu Screen -->
        <div id="menu-screen" class="card">
            <h1>Tic-Tac-Toe</h1>
            <div class="control-group">
                <label>Choose Mode:</label>
                <div class="mode-buttons">
                    <button id="mode-ai" class="btn active">vs AI</button>
                    <button id="mode-p2p" class="btn">2 Player</button>
                </div>
            </div>
            
            <div id="difficulty-group" class="control-group">
                <label>AI Difficulty:</label>
                <div class="diff-buttons">
                    <button id="diff-easy" class="btn">Easy</button>
                    <button id="diff-medium" class="btn">Medium</button>
                    <button id="diff-hard" class="btn active">Hard</button>
                </div>
            </div>

            <button id="start-btn" class="btn action-btn">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="card hidden">
            <div class="game-header">
                <button id="back-btn" class="secondary-btn">⬅ Menu</button>
                <div id="status">Player X's Turn</div>
                <button id="reset-btn" class="secondary-btn">Reset 🔄</button>
            </div>

            <!-- Scoreboard -->
            <div class="scoreboard">
                <div class="score-box">
                    <span id="label-p1">Player X</span>
                    <span id="score-p1" class="score-num">0</span>
                </div>
                <div class="score-box">
                    <span>Draws</span>
                    <span id="score-draws" class="score-num">0</span>
                </div>
                <div class="score-box">
                    <span id="label-p2">AI (Hard)</span>
                    <span id="score-p2" class="score-num">0</span>
                </div>
            </div>

            <!-- Board -->
            <div id="board" class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
