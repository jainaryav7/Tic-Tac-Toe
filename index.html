<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Enhanced Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ably Client Library Dependency for Live cross-device synchronization -->
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
</head>
<body class="dark-mode">

    <div class="top-bar">
        <button id="theme-toggle">☀️ Light Mode</button>
        <div id="connection-status">🟡 Offline / Connecting...</div>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="card">
        <h1>Tic-Tac-Toe Online</h1>
        <p class="subtitle">Play instantly across different screens and devices!</p>
        
        <div class="menu-actions">
            <button id="create-match-btn" class="primary-btn">🌐 Create Online Match Link</button>
            <div id="link-container" class="hidden">
                <p>Send this unique link to your friend:</p>
                <div class="link-box">
                    <input type="text" id="share-link-input" readonly>
                    <button id="copy-btn">Copy Link</button>
                </div>
            </div>
            
            <div class="divider"><span>OR</span></div>
            
            <p class="info-text">If a friend sent you a link, simply click it or open it directly in your browser to connect!</p>
        </div>
    </div>

    <!-- GAME BOARD SCREEN -->
    <div id="game-screen" class="card hidden">
        <div class="scoreboard">
            <div class="score-card text-x">
                <span class="label">Player X</span>
                <span id="score-x" class="score">0</span>
            </div>
            <div class="score-card text-draw">
                <span class="label">Draws</span>
                <span id="score-draw" class="score">0</span>
            </div>
            <div class="score-card text-o">
                <span class="label">Player O</span>
                <span id="score-o" class="score">0</span>
            </div>
        </div>

        <div id="status-display">Waiting for opponent...</div>

        <div class="grid" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="game-actions">
            <button id="rematch-btn" disabled>Offer Rematch</button>
            <button id="exit-btn" class="secondary-btn">Leave Room</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
